name: E.D-OS kernel build and boot test

on:
  push:
    branches: [arquitectura/0.1]
    paths: ["kernel/**", ".github/workflows/kernel-build.yml"]
  pull_request:
    branches: [arquitectura/0.1]
    paths: ["kernel/**", ".github/workflows/kernel-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld make binutils xorriso qemu-system-x86 ovmf
      - name: Unit-test PS/2 keyboard decoding
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/keyboard.c kernel/tests/keyboard_test.c -o /tmp/ed-os-keyboard-test
          /tmp/ed-os-keyboard-test
      - name: Unit-test x86-64 page tables
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/paging.c kernel/tests/paging_test.c -o /tmp/ed-os-paging-test
          /tmp/ed-os-paging-test
      - name: Unit-test Buddy allocator
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/buddy.c kernel/tests/buddy_test.c -o /tmp/ed-os-buddy-test
          /tmp/ed-os-buddy-test
      - name: Unit-test x86-64 cooperative context switching
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/context.c kernel/src/context.S kernel/tests/context_test.c -o /tmp/ed-os-context-test
          /tmp/ed-os-context-test
      - name: Unit-test scheduler and IPC foundations
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/context.c kernel/src/context.S kernel/src/scheduler.c kernel/tests/scheduler_test.c -o /tmp/ed-os-scheduler-test
          /tmp/ed-os-scheduler-test
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/ipc.c kernel/tests/ipc_test.c -o /tmp/ed-os-ipc-test
          /tmp/ed-os-ipc-test
      - name: Unit-test syscall dispatcher
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/context.c kernel/src/context.S kernel/src/scheduler.c kernel/src/syscall.c kernel/tests/syscall_test.c -o /tmp/ed-os-syscall-test
          /tmp/ed-os-syscall-test
      - name: Unit-test RAM filesystem
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/ramfs.c kernel/tests/ramfs_test.c -o /tmp/ed-os-ramfs-test
          /tmp/ed-os-ramfs-test
      - name: Unit-test VFS over RAMFS
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/ramfs.c kernel/src/vfs.c kernel/tests/vfs_test.c -o /tmp/ed-os-vfs-test
          /tmp/ed-os-vfs-test
      - name: Unit-test block devices and RAM disk
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/block.c kernel/tests/block_test.c -o /tmp/ed-os-block-test
          /tmp/ed-os-block-test
      - name: Unit-test EDFS block-backed filesystem
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel/include kernel/src/block.c kernel/src/edfs.c kernel/tests/edfs_test.c -o /tmp/ed-os-edfs-test
          /tmp/ed-os-edfs-test
      - name: Download pinned Limine binary release
        run: |
          curl -fL --retry 3 https://github.com/Limine-Bootloader/Limine/releases/download/v12.9.6/limine-binary.tar.gz -o limine-binary.tar.gz
          echo "b38aabb042b0c0f9f562b7741be3c1204838d7bbacfa78bb411c674bd5b984ee  limine-binary.tar.gz" | sha256sum -c -
          mkdir -p limine-bin
          tar -xzf limine-binary.tar.gz -C limine-bin
          LIMINE_DIR="$(dirname "$(find "$PWD/limine-bin" -name limine-bios.sys -print -quit)")"
          test -f "$LIMINE_DIR/limine-bios.sys"
          # The pinned binary release ships the host installer as portable source.
          make -C "$LIMINE_DIR"
          test -x "$LIMINE_DIR/limine"
          echo "LIMINE_DIR=$LIMINE_DIR" >> "$GITHUB_ENV"
      - name: Build E.D-OS ELF and hybrid boot ISO
        run: |
          make -C kernel clean all
          make -C kernel iso LIMINE_DIR="$LIMINE_DIR"
          file kernel/build/ed-os-kernel.elf
          readelf -h kernel/build/ed-os-kernel.elf
          readelf -l kernel/build/ed-os-kernel.elf
      - name: Boot independent kernel in QEMU (BIOS)
        run: |
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 256M -boot d -cdrom kernel/build/ed-os.iso -display none -serial file:kernel/build/qemu-serial.log -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU exited unexpectedly: $status"
            exit "$status"
          fi
          cat kernel/build/qemu-serial.log
          grep -q "SERIAL_DRIVER_READY COM1" kernel/build/qemu-serial.log
          grep -q "MEMORY_MAP_OK" kernel/build/qemu-serial.log
          grep -q "GDT_TSS_IST_READY" kernel/build/qemu-serial.log
          grep -q "IDT_READY entries=256 exceptions=32" kernel/build/qemu-serial.log
          grep -q "PMM_ALLOC_ZEROED_OK" kernel/build/qemu-serial.log
          grep -q "PMM_FREE_OK" kernel/build/qemu-serial.log
          grep -q "PMM_DOUBLE_FREE_GUARD_OK" kernel/build/qemu-serial.log
          grep -q "PMM_REUSE_AND_ZERO_OK" kernel/build/qemu-serial.log
          grep -q "PMM_INVARIANTS_OK" kernel/build/qemu-serial.log
          grep -q "PAGING_TABLES_OK" kernel/build/qemu-serial.log
          grep -q "PAGING_ACTIVE_MAP_OK" kernel/build/qemu-serial.log
          grep -q "PS2_KEYBOARD_IRQ_READY" kernel/build/qemu-serial.log
          grep -q "PIT_TIMER_IRQ_OK" kernel/build/qemu-serial.log
          grep -q "SCHEDULER_CONTEXT_SWITCH_OK" kernel/build/qemu-serial.log
          grep -q "VFS_RUNTIME_OK" kernel/build/qemu-serial.log
          grep -q "BLOCK_RAMDISK_RUNTIME_OK" kernel/build/qemu-serial.log
          grep -q "EDFS_RUNTIME_OK" kernel/build/qemu-serial.log
          grep -q "KERNEL_MEMORY_MILESTONE_OK" kernel/build/qemu-serial.log
          grep -q "EXCEPTION vector=0x000000000000000e" kernel/build/qemu-serial.log
          grep -q "PAGE_FAULT_ADDRESS=" kernel/build/qemu-serial.log
          grep -q "KERNEL_HALTED_ON_EXCEPTION" kernel/build/qemu-serial.log
      - name: Boot independent kernel in QEMU (UEFI)
        run: |
          set -e
          if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          fi
          test -n "$OVMF_CODE"
          test -n "$OVMF_VARS"
          cp "$OVMF_VARS" kernel/build/OVMF_VARS.fd
          set +e
          timeout 20s qemu-system-x86_64 -machine q35 -m 256M -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" -drive if=pflash,format=raw,file=kernel/build/OVMF_VARS.fd -boot order=d -cdrom kernel/build/ed-os.iso -display none -serial file:kernel/build/qemu-uefi-serial.log -monitor none -no-reboot -no-shutdown
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            echo "QEMU UEFI exited unexpectedly: $status"
            exit "$status"
          fi
          cat kernel/build/qemu-uefi-serial.log
          grep -q "SERIAL_DRIVER_READY COM1" kernel/build/qemu-uefi-serial.log
          grep -q "GDT_TSS_IST_READY" kernel/build/qemu-uefi-serial.log
          grep -q "SCHEDULER_CONTEXT_SWITCH_OK" kernel/build/qemu-uefi-serial.log
          grep -q "VFS_RUNTIME_OK" kernel/build/qemu-uefi-serial.log
          grep -q "BLOCK_RAMDISK_RUNTIME_OK" kernel/build/qemu-uefi-serial.log
          grep -q "EDFS_RUNTIME_OK" kernel/build/qemu-uefi-serial.log
          grep -q "PAGING_ACTIVE_MAP_OK" kernel/build/qemu-uefi-serial.log
          grep -q "PIT_TIMER_IRQ_OK" kernel/build/qemu-uefi-serial.log
          grep -q "EXCEPTION vector=0x000000000000000e" kernel/build/qemu-uefi-serial.log
          grep -q "PAGE_FAULT_ADDRESS=" kernel/build/qemu-uefi-serial.log
      - name: Upload kernel and boot diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ed-os-kernel-memory-milestone
          path: |
            kernel/build/ed-os-kernel.elf
            kernel/build/ed-os.iso
            kernel/build/qemu-serial.log
            kernel/build/qemu-uefi-serial.log
