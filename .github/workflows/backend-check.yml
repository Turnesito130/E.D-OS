name: E.D. Ecosystem backend integration

on:
  push:
    branches: ["arquitectura/0.1"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    branches: ["arquitectura/0.1"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ed
          POSTGRES_PASSWORD: ed_test_password
          POSTGRES_DB: ed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ed -d ed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        env:
          MINIO_ROOT_USER: edtest
          MINIO_ROOT_PASSWORD: ed_test_password_123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          DATABASE_URL: postgres://ed:ed_test_password@localhost:5432/ed_test
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: ed-test
          S3_ACCESS_KEY_ID: edtest
          S3_SECRET_ACCESS_KEY: ed_test_password_123
          S3_REGION: us-east-1
