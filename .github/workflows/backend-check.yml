name: E.D. Ecosystem backend integration

on:
  push:
    branches: ["arquitectura/0.1"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    branches: ["arquitectura/0.1"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ed
          POSTGRES_PASSWORD: ed_test_password
          POSTGRES_DB: ed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ed -d ed_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --ignore-scripts
      - run: npm run check
      - run: npm test
        env:
          DATABASE_URL: postgres://ed:ed_test_password@localhost:5432/ed_test
